name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: Backend/coverage
          if-no-files-found: ignore

  patient-app:
    name: Patient app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Book-My-Appointment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Book-My-Appointment/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com
      - name: No server secrets in the bundle
        run: "! grep -rEl 'JWT_|ADMIN_PASSWORD|mongodb(\\+srv)?://|rzp_' dist"
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-patient-app
          path: Book-My-Appointment/coverage
          if-no-files-found: ignore

  staff-app:
    name: Staff app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com
      - name: No server secrets in the bundle
        run: "! grep -rEl 'JWT_|ADMIN_PASSWORD|mongodb(\\+srv)?://|rzp_' dist"
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-staff-app
          path: admin/coverage
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, patient-app, staff-app]
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The runner already has Google Chrome, which the suite drives with channel "chrome".
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017/bma_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Book-My-Appointment/package-lock.json
            admin/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npm run setup
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
